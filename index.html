<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaejoong Recipes</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
background:#1a1210;
color:#f0e6dc;
font-family:'DM Sans',sans-serif;
}

.recipe-card{
transition:0.3s;
}

.recipe-card:hover{
transform:translateY(-6px);
}

.tag{
padding:3px 8px;
font-size:11px;
border-radius:20px;
font-weight:600;
}
</style>
</head>

<body>

<header class="text-center py-10">
<h1 class="text-4xl font-black" style="font-family:'Noto Serif KR',serif;">
Jaejoong Recipes
</h1>
<p class="text-sm text-neutral-400">
Korean noodle dishes
</p>
</header>

<main class="max-w-6xl mx-auto px-6">
<div id="recipe-grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
</main>


<!-- MODAL -->
<div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black/80">

<div class="bg-[#241c17] max-w-lg w-full rounded-xl overflow-hidden">

<img id="modal-img" class="w-full h-60 object-cover">

<div class="p-6">

<h2 id="modal-title" class="text-2xl font-bold mb-2"></h2>

<p id="modal-desc" class="text-sm text-neutral-300"></p>

<button onclick="closeModal()" class="mt-5 bg-[#c4956a] px-4 py-2 rounded">
Close
</button>

</div>
</div>
</div>


<script>

const recipes = [

{
name:"Bibim-naengmyeon",
image:"e680ebf99520ff3595825be992081443.jpg",
desc:"Spicy cold buckwheat noodles with gochujang sauce."
},

{
name:"Ramen",
image:"21eae66871ea8e839cbbb9d16bebe98d.jpg",
desc:"Quick Korean ramyeon with egg and vegetables."
},

{
name:"Jjamppong",
image:"9961174d3febb4ec39703cc5b8cb2824.jpg",
desc:"Spicy seafood noodle soup."
},

{
name:"Kalguksu",
image:"139f7dc556e170fcd548819ea96e66f3.jpg",
desc:"Knife-cut noodles in anchovy broth."
}

];


function renderCards(){

const grid=document.getElementById("recipe-grid");

recipes.forEach(r=>{

const card=document.createElement("div");
card.className="recipe-card bg-[#241c17] rounded-xl overflow-hidden cursor-pointer";

card.innerHTML=`

<img src="./${r.image}" class="w-full h-44 object-cover">

<div class="p-4">

<h3 class="font-bold">${r.name}</h3>

<p class="text-xs text-neutral-400 mt-1">${r.desc}</p>

</div>

`;

card.onclick=()=>openModal(r);

grid.appendChild(card);

});

}


function openModal(r){

document.getElementById("modal-img").src="./"+r.image;
document.getElementById("modal-title").textContent=r.name;
document.getElementById("modal-desc").textContent=r.desc;

document.getElementById("modal").classList.remove("hidden");
document.getElementById("modal").classList.add("flex");

}


function closeModal(){

document.getElementById("modal").classList.add("hidden");
document.getElementById("modal").classList.remove("flex");

}


renderCards();
lucide.createIcons();

</script>

</body>
</html>
